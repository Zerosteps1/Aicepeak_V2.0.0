# Generated by tools/factory/clients.py sync. Use the isolated launcher.
model = "gpt-6-astra"
model_provider = "factory"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"

[features]
hooks = false
plugin_hooks = false
plugins = false
remote_plugin = false
memories = false
memory_tool = false
remote_models = false
responses_websockets = false
responses_websockets_v2 = false

[memories]
generate_memories = false
use_memories = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[model_providers.factory]
name = "Per-job factory broker"
base_url = "http://credential-proxy:8080/openai/v1"
env_key = "FACTORY_PROXY_TOKEN"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false
request_max_retries = 0
stream_max_retries = 0

[model_providers.factory.capabilities]
remote_compaction = "unsupported"
external_web_access = false

[mcp_servers.context7]
url = "http://credential-proxy:8080/context7/mcp"
bearer_token_env_var = "FACTORY_PROXY_TOKEN"
enabled_tools = ["resolve-library-id", "query-docs"]
startup_timeout_sec = 30
tool_timeout_sec = 60
required = true

[agents]
max_concurrent_threads_per_session = 2
max_depth = 1

[agents.factory_author]
description = "Implement the authorized repository change and verify it."
config_file = "agents/factory_author.toml"

[agents.factory_senior_reviewer]
description = "Local Astra code review; independent server review still decides the gate."
config_file = "agents/factory_senior_reviewer.toml"
