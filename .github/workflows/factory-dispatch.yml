name: Factory trusted dispatcher

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Factory review feedback ingress]
    types: [completed]
  push:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number for a manual retry
        required: true
        type: string

permissions: {}
cache-mode: none

jobs:
  dispatch:
    if: github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout immutable trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate metadata and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_EVENT: ${{ github.event_name }}
          FACTORY_REF: ${{ github.ref }}
        run: python3 .github/scripts/dispatch_factory.py
