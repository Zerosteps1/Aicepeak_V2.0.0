# Why: GitHub events from PRs and comments must never run PR-controlled code with write access. This dispatcher is
# the only workflow those events start: it runs trusted code (the default branch's copy; for a push, the pushed
# branch's own copy, which acts only for listed branches), reads metadata only and decides which config-branch
# workflow runs.
# What: validates the event, the actor and the target branch against the config branch's configuration, then
# dispatches factory.yml and factory-promotion.yml on the config branch and cancels runs a newer event made obsolete.
# When: PR opened, updated, edited or marked ready; issue and PR comments (commands, feedback); a completed
# factory-feedback.yml run (reviews); pushes to branches (a moved config branch re-runs every open PR).
name: Factory trusted dispatcher

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Factory review feedback ingress]
    types: [completed]
  # Listed branch names never contain a slash. A push runs the pushed branch's copy of this
  # workflow; the script acts only for listed branches of the config branch's configuration.
  push:
    branches: ['*']

permissions: {}
cache-mode: none

jobs:
  dispatch:
    if: github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && (github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # Reads /review and /accept comments on work-order issues and their author (dispatch_factory.issue_command).
      issues: read
      checks: read
      actions: write
    steps:
      - name: Checkout immutable trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate metadata and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_EVENT: ${{ github.event_name }}
          FACTORY_REF: ${{ github.ref }}
        run: python3 .github/scripts/dispatch_factory.py
