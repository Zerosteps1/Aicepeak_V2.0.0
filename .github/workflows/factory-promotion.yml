# Why: a production branch takes only promotions and config PRs, and GitHub needs one required check that decides
# which a PR is and whether it may merge; that check must be computed by trusted code with the publisher App.
# What: classifies the PR into a production branch and publishes factory/production/<branch>: a promotion passes
# while its head is the validation branch's tip, contains production and (by review mode) has a passed AI review;
# a config PR passes with enough maintainer approvals; a maintainer /bypass can pass a promotion for one head.
# When: dispatched by factory-dispatch.yml for PR events, reviews and pushes; by a maintainer device after its AI
# review; or by hand (`gh workflow run factory-promotion.yml`) when that re-run did not happen.
name: Factory production check

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: true
      bypass:
        description: Maintainer /bypass comment ID for the PR's current head; only promotions accept it
        type: string
        default: ''
      head:
        description: PR head SHA the dispatcher read for a /bypass; the check refuses the bypass for any other head
        type: string
        default: ''

# Dispatched on the config branch only. promotion.py verifies GITHUB_REF against config_branch
# before acting, and the factory-promotion environment (publisher key only) admits only that branch.
permissions: {}
cache-mode: none
# A /bypass check cancels a running one: its result for the bypassed head no longer matters.
concurrency:
  group: factory-promotion-${{ github.repository }}-pr-${{ fromJSON(inputs.pr) }}
  cancel-in-progress: ${{ inputs.bypass != '' }}

jobs:
  production:
    name: Production check
    if: github.repository == 'Zerosteps1/Aicepeak_V2.0.0'
    runs-on: ubuntu-24.04
    environment: factory-promotion
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          BYPASS_COMMENT: ${{ inputs.bypass }}
          HEAD_SHA: ${{ inputs.head }}
        run: python3 tools/factory/promotion.py --pr "$PR_NUMBER" --bypass-comment "${BYPASS_COMMENT:-0}" --head "$HEAD_SHA"
