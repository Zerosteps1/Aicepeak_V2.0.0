name: Factory production check

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: true
      bypass:
        description: Maintainer /bypass comment ID for the PR's current head; only promotions accept it
        type: string
        default: ''
      head:
        description: PR head SHA the dispatcher read for a /bypass; the check refuses the bypass for any other head
        type: string
        default: ''

# Dispatched on the config branch only. promotion.py verifies GITHUB_REF against config_branch
# before acting, and the factory-promotion environment (publisher key only) admits only that branch.
permissions: {}
cache-mode: none
concurrency:
  group: factory-promotion-${{ github.repository }}-pr-${{ fromJSON(inputs.pr) }}
  cancel-in-progress: false

jobs:
  production:
    name: Production check
    if: github.repository == 'Zerosteps1/Aicepeak_V2.0.0'
    runs-on: ubuntu-24.04
    environment: factory-promotion
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          BYPASS_COMMENT: ${{ inputs.bypass }}
          HEAD_SHA: ${{ inputs.head }}
        run: python3 tools/factory/promotion.py --pr "$PR_NUMBER" --bypass-comment "${BYPASS_COMMENT:-0}" --head "$HEAD_SHA"
