# Why: every factory stage that holds a credential (App keys, the Anthropic federation, the publisher's write access)
# must run trusted code, so all of them live in this one workflow and run only from the config branch tip.
# What: snapshot -> deterministic tests -> publish gates for each PR; the senior-review coordination and the
# automatic correction (author, push); the /review and /bypass commands; the issue reviewer and /accept for
# work-order issues; a WIF smoke.
# When: never on its own events. factory-dispatch.yml dispatches it (workflow_dispatch on the config branch) for PR
# events, feedback and commands; a maintainer device dispatches the correction after a review; a maintainer
# dispatches it by hand only for an explicit retry.
name: Factory trusted pipeline

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number; 0 for a work-order issue run
        type: string
        default: '0'
      feedback_kind:
        type: choice
        options: [none, issue_comment, review, review_comment]
        default: none
      feedback_id:
        type: string
        default: '0'
      retry:
        description: Explicit maintainer retry; previous cost/round reservations remain charged
        type: boolean
        default: false
      correction:
        description: Authenticated factory/senior-review check ID; starts an author correction for that review
        type: string
        default: ''
      wif_smoke:
        description: Test config-branch-only Anthropic federation and one tiny model call; no PR pipeline
        type: boolean
        default: false
      review_check:
        description: Senior gate check ID for a local review claim or result
        type: string
        default: ''
      review_claim:
        description: Unique local invocation ID; claims never expire or transfer
        type: string
        default: ''
      review_result:
        description: App-authenticated local result check ID; empty requests a claim
        type: string
        default: ''
      review_request:
        description: Maintainer /review comment ID on a production PR; reserves factory/senior-review for its current head
        type: string
        default: ''
      bypass:
        description: Maintainer /bypass comment ID; publishes the PR's required factory checks for its current head as bypassed
        type: string
        default: ''
      head:
        description: PR head SHA the dispatcher read for a /review or /bypass; the stage refuses any other head
        type: string
        default: ''
      issue:
        description: Work-order issue number of a maintainer's /review or /accept on it; 0 for PR runs
        type: string
        default: '0'
      issue_command:
        description: The command on the work-order issue
        type: choice
        options: [none, review, accept]
        default: none
      comment:
        description: Comment ID of the maintainer's /review or /accept on the work-order issue
        type: string
        default: '0'

# Every job is dispatched on the config branch. The expressions cannot read factory/config.json:
# each stage verifies GITHUB_REF against config_branch before acting, and the factory-control
# environment admits only the config branch.
permissions: {}
cache-mode: none
# One group per PR or work-order issue. GitHub keeps one pending run per group and cancels an older pending one.
concurrency:
  group: factory-${{ github.repository }}-${{ inputs.issue != '0' && format('issue-{0}', inputs.issue) || format('pr-{0}', fromJSON(inputs.pr)) }}
  cancel-in-progress: false

jobs:
  wif-smoke:
    name: Anthropic federation smoke
    if: inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0'
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exchange GitHub identity and verify Claude inference
        run: python3 tools/factory/wif_smoke.py

  snapshot:
    name: Snapshot
    if: ${{ !inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && inputs.correction == '' && inputs.review_check == '' && inputs.review_claim == '' && inputs.review_result == '' && inputs.review_request == '' && inputs.bypass == '' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: snapshot
        env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          FEEDBACK_KIND: ${{ inputs.feedback_kind }}
          FEEDBACK_ID: ${{ inputs.feedback_id }}
          FACTORY_RETRY: ${{ inputs.retry }}
        run: python3 tools/factory/engine.py snapshot --pr "$PR_NUMBER" --feedback-kind "$FEEDBACK_KIND" --feedback-id "$FEEDBACK_ID"

  tests:
    name: Deterministic tests
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      # A work-order issue is re-checked against the snapshot's pin (tools/factory/issues.py).
      issues: read
    outputs:
      tests: ${{ steps.test.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: test
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot }}
        run: python3 tools/factory/engine.py test

  publish:
    name: Publish gates
    needs: [snapshot, tests]
    if: always() && needs.snapshot.result == 'success'
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: publish
        env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot }}
          TESTS_JSON: ${{ needs.tests.outputs.tests }}
          TEST_JOB_RESULT: ${{ needs.tests.result }}
        run: python3 tools/factory/engine.py publish

  # Shares the whole workflow's PR concurrency lock with snapshots and corrections.
  # Only this trusted config-branch job may claim or complete the senior-review gate.
  review-coordinate:
    name: Review coordination
    if: ${{ !inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && inputs.correction == '' && inputs.review_request == '' && inputs.bypass == '' && (inputs.review_check != '' || inputs.review_claim != '' || inputs.review_result != '') }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          REVIEW_CHECK: ${{ inputs.review_check }}
          REVIEW_CLAIM: ${{ inputs.review_claim }}
          REVIEW_RESULT: ${{ inputs.review_result }}
        run: python3 tools/factory/local_review_queue.py --pr "$PR_NUMBER" --check-id "$REVIEW_CHECK" --claim-id "$REVIEW_CLAIM" --result-id "${REVIEW_RESULT:-0}"

  # The senior review runs on the maintainer's machine (tools/factory/local_review.py, ADR-0005).
  # It dispatches this workflow with `correction` when a review requests changes.
  correction:
    name: Correction gate
    if: ${{ !inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && inputs.correction != '' && inputs.review_check == '' && inputs.review_claim == '' && inputs.review_result == '' && inputs.review_request == '' && inputs.bypass == '' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.correction.outputs.snapshot }}
      author: ${{ steps.correction.outputs.author }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: correction
        env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          CHECK_ID: ${{ inputs.correction }}
        run: python3 tools/factory/engine.py correction --pr "$PR_NUMBER" --check-id "$CHECK_ID"

  author:
    name: Author correction
    needs: [correction]
    if: needs.correction.result == 'success' && fromJSON(needs.correction.outputs.author).enabled == true
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      issues: read
      # GitHub OIDC identity for Workload Identity Federation; only the broker exchanges it.
      id-token: write
    outputs:
      report: ${{ steps.author.outputs.report }}
      failure: ${{ steps.author.outputs.failure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: author
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          SNAPSHOT_JSON: ${{ needs.correction.outputs.snapshot }}
          AUTHOR_JSON: ${{ needs.correction.outputs.author }}
        run: python3 tools/factory/engine.py author --patch "$RUNNER_TEMP/patch.diff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-patch
          path: ${{ runner.temp }}/patch.diff
          if-no-files-found: error
          retention-days: 3

  push:
    name: Push correction
    needs: [correction, author]
    if: needs.author.result == 'success'
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          FACTORY_WRITER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_WRITER_APP_PRIVATE_KEY }}
          SNAPSHOT_JSON: ${{ needs.correction.outputs.snapshot }}
          AUTHOR_JSON: ${{ needs.correction.outputs.author }}
          AUTHOR_REPORT: ${{ needs.author.outputs.report }}
        run: python3 tools/factory/engine.py push --patch "$RUNNER_TEMP/patch.diff"

  author-failed:
    name: Author handoff
    needs: [correction, author, push]
    if: always() && needs.correction.result == 'success' && fromJSON(needs.correction.outputs.author).enabled == true && needs.push.result != 'success'
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          SNAPSHOT_JSON: ${{ needs.correction.outputs.snapshot }}
          AUTHOR_REPORT: ${{ needs.author.outputs.report }}
          AUTHOR_FAILURE: ${{ needs.author.outputs.failure }}
        run: python3 tools/factory/engine.py author-failed

  # A maintainer's /review comment on a production PR reserves the senior review for the head it was
  # posted for; a maintainer device then reviews it as usual. New commits never re-reserve it.
  review-request:
    name: Review request
    if: ${{ !inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && inputs.review_request != '' && inputs.bypass == '' && inputs.correction == '' && inputs.review_check == '' && inputs.review_claim == '' && inputs.review_result == '' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          COMMENT_ID: ${{ inputs.review_request }}
          HEAD_SHA: ${{ inputs.head }}
        run: python3 tools/factory/engine.py review-request --pr "$PR_NUMBER" --comment-id "$COMMENT_ID" --head "$HEAD_SHA"

  # A maintainer's /bypass <reason> comment publishes the PR's required factory checks for the head
  # it was posted for as passed by bypass, recording login and reason. Never for config PRs.
  bypass:
    name: Bypass
    if: ${{ !inputs.wif_smoke && inputs.issue == '0' && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' && inputs.bypass != '' && inputs.review_request == '' && inputs.correction == '' && inputs.review_check == '' && inputs.review_claim == '' && inputs.review_result == '' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ inputs.pr }}
          COMMENT_ID: ${{ inputs.bypass }}
          HEAD_SHA: ${{ inputs.head }}
        run: python3 tools/factory/engine.py bypass --pr "$PR_NUMBER" --comment-id "$COMMENT_ID" --head "$HEAD_SHA"

  # Work-order issues (tools/factory/issue_review.py). A maintainer's /review on a maintainer's issue:
  # the review job calls the model without any App key, the publish job posts with the publisher App and no
  # model credential. A maintainer's /accept: the accept job edits only the factory-task block and records the approval.
  issue-review:
    name: Issue review
    if: ${{ inputs.issue != '0' && inputs.issue_command == 'review' && inputs.pr == '0' && !inputs.wif_smoke && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      # GitHub OIDC identity for Workload Identity Federation (the same federation rule as the author job).
      id-token: write
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: review
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment }}
        run: python3 tools/factory/issue_review.py review --issue "$ISSUE_NUMBER" --comment-id "$COMMENT_ID"

  issue-publish:
    name: Issue review comments
    needs: issue-review
    if: always() && needs.issue-review.result != 'skipped'
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment }}
          REVIEW_JSON: ${{ needs.issue-review.outputs.review }}
        run: python3 tools/factory/issue_review.py publish --issue "$ISSUE_NUMBER" --comment-id "$COMMENT_ID"

  issue-accept:
    name: Issue accept
    if: ${{ inputs.issue != '0' && inputs.issue_command == 'accept' && inputs.pr == '0' && !inputs.wif_smoke && github.repository == 'Zerosteps1/Aicepeak_V2.0.0' }}
    runs-on: ubuntu-24.04
    environment: factory-control
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          FACTORY_PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.FACTORY_PUBLISHER_APP_PRIVATE_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment }}
        run: python3 tools/factory/issue_review.py accept --issue "$ISSUE_NUMBER" --comment-id "$COMMENT_ID"
